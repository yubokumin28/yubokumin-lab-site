<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
  <!-- peeking seal head popping up -->
  <defs>
    <radialGradient id="peekBody" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </radialGradient>
  </defs>
  <!-- head (half visible) -->
  <path d="M 6 40 Q 6 14 24 14 Q 42 14 42 40 Z"
        fill="url(#peekBody)" stroke="#cbd5e1" stroke-width="1.4"/>
  <!-- ears / top tufts -->
  <path d="M 10 20 Q 14 12 18 18 Z" fill="url(#peekBody)" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M 38 20 Q 34 12 30 18 Z" fill="url(#peekBody)" stroke="#cbd5e1" stroke-width="1"/>
  <!-- spots -->
  <circle cx="14" cy="22" r="1.2" fill="#1f2937" opacity="0.75"/>
  <circle cx="34" cy="22" r="1.3" fill="#1f2937" opacity="0.75"/>
  <circle cx="24" cy="18" r="1" fill="#1f2937" opacity="0.65"/>
  <!-- eyes -->
  <circle cx="18" cy="28" r="2.2" fill="#0f172a"/>
  <circle cx="30" cy="28" r="2.2" fill="#0f172a"/>
  <circle cx="18.7" cy="27.2" r="0.7" fill="#ffffff"/>
  <circle cx="30.7" cy="27.2" r="0.7" fill="#ffffff"/>
  <!-- cheeks -->
  <ellipse cx="14" cy="33" rx="2.4" ry="1.6" fill="#fca5a5" opacity="0.55"/>
  <ellipse cx="34" cy="33" rx="2.4" ry="1.6" fill="#fca5a5" opacity="0.55"/>
  <!-- nose -->
  <ellipse cx="24" cy="34" rx="1.4" ry="0.9" fill="#1f2937"/>
  <!-- mouth -->
  <path d="M 22 36 Q 24 38 26 36" stroke="#1f2937" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
