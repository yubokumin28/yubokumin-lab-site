<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" aria-hidden="true">
  <defs>
    <radialGradient id="emptyBody" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <radialGradient id="emptyBelly" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="128" cy="230" rx="96" ry="10" fill="#0f172a" opacity="0.06"/>
  <!-- body (pear shape) -->
  <path d="M 128 50 C 70 50 50 110 60 170 C 66 215 110 230 128 230 C 146 230 190 215 196 170 C 206 110 186 50 128 50 Z"
        fill="url(#emptyBody)" stroke="#cbd5e1" stroke-width="2"/>
  <!-- belly highlight -->
  <ellipse cx="128" cy="165" rx="48" ry="50" fill="url(#emptyBelly)" opacity="0.9"/>
  <!-- flippers -->
  <ellipse cx="60" cy="180" rx="24" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" transform="rotate(-15 60 180)"/>
  <ellipse cx="196" cy="180" rx="24" ry="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" transform="rotate(15 196 180)"/>
  <!-- tail flippers -->
  <path d="M 108 225 Q 100 245 118 240 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M 148 225 Q 156 245 138 240 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- spots scattered on back -->
  <circle cx="95" cy="80" r="3.5" fill="#1f2937" opacity="0.75"/>
  <circle cx="160" cy="75" r="3" fill="#1f2937" opacity="0.75"/>
  <circle cx="80" cy="120" r="3.2" fill="#1f2937" opacity="0.7"/>
  <circle cx="180" cy="115" r="2.8" fill="#1f2937" opacity="0.7"/>
  <circle cx="70" cy="155" r="2.6" fill="#1f2937" opacity="0.65"/>
  <circle cx="190" cy="150" r="2.8" fill="#1f2937" opacity="0.65"/>
  <circle cx="128" cy="60" r="2.4" fill="#1f2937" opacity="0.7"/>
  <circle cx="110" cy="100" r="2.2" fill="#1f2937" opacity="0.5"/>
  <circle cx="148" cy="95" r="2.5" fill="#1f2937" opacity="0.55"/>
  <!-- cheeks -->
  <ellipse cx="92" cy="130" rx="12" ry="7" fill="#fca5a5" opacity="0.55"/>
  <ellipse cx="164" cy="130" rx="12" ry="7" fill="#fca5a5" opacity="0.55"/>
  <!-- eyes (closed/content shape for sleepy look) -->
  <circle cx="104" cy="115" r="6" fill="#0f172a"/>
  <circle cx="152" cy="115" r="6" fill="#0f172a"/>
  <circle cx="106" cy="112" r="2" fill="#ffffff"/>
  <circle cx="154" cy="112" r="2" fill="#ffffff"/>
  <!-- nose -->
  <ellipse cx="128" cy="138" rx="6" ry="4" fill="#1f2937"/>
  <!-- mouth smile -->
  <path d="M 118 148 Q 128 156 138 148" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <line x1="90" y1="145" x2="112" y2="145" stroke="#94a3b8" stroke-width="1"/>
  <line x1="144" y1="145" x2="166" y2="145" stroke="#94a3b8" stroke-width="1"/>
  <line x1="90" y1="150" x2="112" y2="150" stroke="#94a3b8" stroke-width="1"/>
  <line x1="144" y1="150" x2="166" y2="150" stroke="#94a3b8" stroke-width="1"/>
</svg>
