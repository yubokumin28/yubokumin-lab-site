<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" aria-hidden="true">
  <defs>
    <radialGradient id="studyBody" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="64" cy="116" rx="44" ry="5" fill="#0f172a" opacity="0.06"/>
  <!-- body -->
  <path d="M 64 22 C 32 22 20 60 28 90 C 34 110 60 116 64 116 C 68 116 94 110 100 90 C 108 60 96 22 64 22 Z"
        fill="url(#studyBody)" stroke="#cbd5e1" stroke-width="1.6"/>
  <!-- spots -->
  <circle cx="46" cy="40" r="1.8" fill="#1f2937" opacity="0.75"/>
  <circle cx="82" cy="38" r="1.6" fill="#1f2937" opacity="0.75"/>
  <circle cx="36" cy="62" r="1.6" fill="#1f2937" opacity="0.65"/>
  <circle cx="92" cy="60" r="1.7" fill="#1f2937" opacity="0.65"/>
  <circle cx="64" cy="30" r="1.3" fill="#1f2937" opacity="0.7"/>
  <!-- flippers holding book -->
  <ellipse cx="38" cy="84" rx="12" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" transform="rotate(20 38 84)"/>
  <ellipse cx="90" cy="84" rx="12" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" transform="rotate(-20 90 84)"/>
  <!-- book -->
  <rect x="40" y="80" width="48" height="28" rx="3" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.4"/>
  <line x1="64" y1="80" x2="64" y2="108" stroke="#1e3a8a" stroke-width="1.2"/>
  <line x1="46" y1="88" x2="60" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  <line x1="46" y1="94" x2="60" y2="94" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  <line x1="46" y1="100" x2="58" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  <line x1="68" y1="88" x2="82" y2="88" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  <line x1="68" y1="94" x2="82" y2="94" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  <line x1="68" y1="100" x2="80" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  <!-- face -->
  <ellipse cx="50" cy="64" rx="5" ry="3.5" fill="#fca5a5" opacity="0.55"/>
  <ellipse cx="78" cy="64" rx="5" ry="3.5" fill="#fca5a5" opacity="0.55"/>
  <!-- eyes (studying, focused) -->
  <circle cx="54" cy="56" r="3" fill="#0f172a"/>
  <circle cx="74" cy="56" r="3" fill="#0f172a"/>
  <circle cx="55" cy="55" r="1" fill="#ffffff"/>
  <circle cx="75" cy="55" r="1" fill="#ffffff"/>
  <!-- nose -->
  <ellipse cx="64" cy="68" rx="2.6" ry="1.8" fill="#1f2937"/>
  <!-- smile -->
  <path d="M 58 73 Q 64 77 70 73" stroke="#1f2937" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- thought bubble / sparkle -->
  <circle cx="106" cy="26" r="3" fill="#fbbf24" opacity="0.85"/>
  <circle cx="98" cy="16" r="2" fill="#fbbf24" opacity="0.7"/>
</svg>
