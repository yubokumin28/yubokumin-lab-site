<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
  <defs>
    <radialGradient id="sealBody" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eef5"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="32" cy="56" rx="22" ry="3.5" fill="#0f172a" opacity="0.08"/>
  <!-- body -->
  <ellipse cx="32" cy="36" rx="24" ry="20" fill="url(#sealBody)" stroke="#cbd5e1" stroke-width="1.2"/>
  <!-- flippers -->
  <ellipse cx="10" cy="44" rx="6" ry="3" fill="url(#sealBody)" stroke="#cbd5e1" stroke-width="1"/>
  <ellipse cx="54" cy="44" rx="6" ry="3" fill="url(#sealBody)" stroke="#cbd5e1" stroke-width="1"/>
  <!-- spots -->
  <circle cx="22" cy="28" r="1.6" fill="#1f2937" opacity="0.8"/>
  <circle cx="42" cy="26" r="1.4" fill="#1f2937" opacity="0.8"/>
  <circle cx="16" cy="40" r="1.3" fill="#1f2937" opacity="0.7"/>
  <circle cx="48" cy="40" r="1.5" fill="#1f2937" opacity="0.7"/>
  <circle cx="32" cy="22" r="1.2" fill="#1f2937" opacity="0.6"/>
  <!-- cheeks -->
  <ellipse cx="20" cy="38" rx="3" ry="2" fill="#fca5a5" opacity="0.55"/>
  <ellipse cx="44" cy="38" rx="3" ry="2" fill="#fca5a5" opacity="0.55"/>
  <!-- eyes -->
  <circle cx="24" cy="33" r="2.4" fill="#0f172a"/>
  <circle cx="40" cy="33" r="2.4" fill="#0f172a"/>
  <circle cx="24.8" cy="32" r="0.8" fill="#ffffff"/>
  <circle cx="40.8" cy="32" r="0.8" fill="#ffffff"/>
  <!-- nose -->
  <ellipse cx="32" cy="40" rx="1.8" ry="1.2" fill="#1f2937"/>
  <!-- mouth -->
  <path d="M 29 42.5 Q 32 45 35 42.5" stroke="#1f2937" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <line x1="18" y1="41" x2="24" y2="41" stroke="#94a3b8" stroke-width="0.6"/>
  <line x1="40" y1="41" x2="46" y2="41" stroke="#94a3b8" stroke-width="0.6"/>
</svg>
